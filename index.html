button></div></div><div class="pan"><h3>🎛 Visualizer, access &amp; language</h3><label>VISUALIZER STYLE<select data-set="vs">${['Bars','Wave','Circle','Particles'].map(d=>`<option ${(s.vs||'Bars')==d?'selected':''}>${d}</option>`).join('')}</select></label><label>VISUALIZER COLOUR<input type="color" data-set="vc" value="${s.vc||'#12c8ff'}"></label>${sw('hc','High contrast')}${sw('big','Larger text')}${sw('rm','Reduce motion')}<label>LANGUAGE<select data-set="lang">${[['en','English'],['es','Español'],['fr','Français'],['sw','Kiswahili'],['pt','Português']].map(([k,n])=>`<option value="${k}" ${(s.lang||'en')==k?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="pan"><h3>✨ Motion studio</h3><label>LIVE WALLPAPER<select data-set="lw">${LW.map(d=>`<option ${s.lw==d?'selected':''}>${d}</option>`).join('')}</select></label><label>WALLPAPER SPEED<input type="range" min="0.3" max="3" step="0.1" data-set="lsp" value="${s.lsp||1}"></label><label>WALLPAPER DENSITY<input type="range" min="10" max="150" data-set="ld" value="${s.ld||60}"></label><label>VIDEO WALLPAPER (mp4 loop)<input id="wv" type="file" accept="video/*"></label><button class="bt2" data-a="wvx">REMOVE VIDEO WALLPAPER</button>${sw('bt','Music-reactive beat (wallpaper and covers)')}${sw('mt','3D hover tilt on cards')}${sw('rp','Click ripples')}${sw('pt','Page transitions')}${sw('vin','Spinning vinyl cover in the player')}${sw('fl','Floating cards and slow-pan hero')}${sw('gt','Animated gradient headings')}${sw('sp','Cursor spotlight')}</div><div class="pan"><h3>🪟 Glass &amp; light</h3><label>GLASS BLUR<input type="range" min="0" max="40" data-set="bl" value="${s.bl??18}"></label><label>PANEL OPACITY<input type="range" min="10" max="100" data-set="go" value="${s.go??55}"></label><label>AURORA GLOW<input type="range" min="0" max="150" data-set="ai" value="${s.ai??100}"></label><label>AURORA HUE SHIFT<input type="range" min="-180" max="180" data-set="hs" value="${s.hs??0}"></label><p class="mu">Quick colours</p><div class="chips">${SK.map((k,i)=>`<span class="chip" data-sk="${i}"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${k[1]};margin-right:6px"></i>${k[0]}</span>`).join('')}</div></div><div class="pan"><h3>☁ Account, backup &amp; storage</h3><p class="mu" id="cinfo">Your library lives in this browser. Use <b>Backup to file</b> below to export everything — metadata plus your uploaded audio, images and videos — and <b>Restore from file</b> on any other device.</p><div class="bar"><button class="bt" data-a="bkp">⬇ BACKUP TO FILE</button><label class="bt2" style="cursor:pointer">RESTORE FROM FILE<input id="rf" type="file" accept=".json" hidden></label></div><p class="mu" id="stg">Backups include your uploaded audio, images and videos.</p><div class="bar"><button class="bt2" data-a="stg">STORAGE INFO</button><button class="bt2" data-a="persist">KEEP MY LIBRARY SAFE</button></div></div></div>`},
lib:()=>`<h1>Playlists</h1><div class="bar"><input id="pln" placeholder="New playlist name" style="max-width:260px;margin-top:12px"><button class="bt" data-a="newPl">CREATE</button></div><div class="grid" style="margin-top:14px">${S.pl.map(p=>`<div class="card" data-go="pl" data-id="${p.id}"><div class="cv nov" style="${cov({hue:p.hue})}"></div><b>${esc(p.name)}</b><small>${p.ids.length} tracks</small></div>`).join('')||'<p class="mu">Create your first mix, then hit ＋ on any track.</p>'}</div>`,
pl:id=>{const p=S.pl.find(x=>x.id==id);if(!p)return'';const ts=L(p.ids.map(i=>S.tracks.find(t=>t.id==i)).filter(Boolean));return `<h1>${esc(p.name)}</h1><small>${ts.length} tracks</small><div class="bar">${ts[0]?`<button class="bt" data-play="${ts[0].id}">▶ PLAY</button>`:''}<button class="bt2" data-a="delPl" data-id="${p.id}">DELETE PLAYLIST</button></div>${ts.map((t,i)=>`<div style="display:flex;align-items:center;gap:6px"><div style="flex:1">${row(t,i)}</div><button class="bt2" style="margin:0" data-rmpl="${p.id}:${t.id}">✕</button></div>`).join('')}`},
admin:()=>{if(!S.admin)return `<h1>Admin Matrix</h1><p class="mu">Locked. <button class="bt2" data-a="door">OPEN ADMIN DOOR</button></p>`;
const tabs=['dashboard','profile','artists','upload','bulk','albums','genres','registry','myid'].map(t=>`<span class="chip ${AT==t?'on':''}" data-tab="${t}">${t=='myid'?'MY ID':t.toUpperCase()}</span>`).join('');let b='';
if(AT=='myid'){const m=S.me;b=`<div class="pan" style="text-align:center;max-width:none"><div class="xl2">YOUR ADMIN ID</div><div class="idc"><div class="idh"><b>BLASTR ●</b><span class="adm2">ADMIN</span></div><div class="idb"><div class="idp" style="${cov(m,'avatar')}"></div><div><small>FULL NAME</small><b>${esc(m.full||m.name||'Admin')}</b><small>AGE</small><b>${esc(m.age||'—')}</b><small>RANK</small><b>${esc(m.rank||'COMING SOON')}</b></div></div><div class="idf"><span>ID •••• ${esc(String(PASS()).slice(-4))}</span><i class="chip2"></i><i class="bar2"></i></div></div><p class="mu">EVERY UPLOAD AND EDIT YOU MAKE IS LOGGED UNDER THIS ID</p><div class="grid" style="--cs:200px;text-align:left">${fld('FULL NAME','mf',m.full||'')}${fld('AGE','ma',m.age||'')}${fld('RANK','mr',m.rank||'')}</div><div class="bar" style="justify-content:center"><button class="bt" data-a="saveId">SAVE ID</button><button class="bt2" data-a="enroll">ENROLL FACE ID${m.face?' ✓':''}</button><button class="bt2" data-a="lock" style="border-color:#ff4d5e;color:#ff4d5e">LOCK SESSION</button></div><div id="fvp" style="max-width:300px;margin:12px auto"></div><p class="mu">Photo comes from Admin → Profile. Change the 8-digit ID in Dashboard.</p><h3>Activity log</h3>${(S.log||[]).slice(0,8).map(l=>`<div class="rg"><span>${esc(l)}</span></div>`).join('')||'<p class="mu">No activity yet.</p>'}</div>`}
if(AT=='dashboard')b=`<div class="grid">${[['Artists',S.artists.length],['Tracks',S.tracks.length],['Albums',S.albums.length],['MP4 loops',S.tracks.filter(t=>t.video).length],['Genres',GEN.length],['Likes',S.likes.length],['Playlists',S.pl.length],['Featured',(S.feat||[]).length],['Duplicates',S.tracks.length-new Set(S.tracks.map(t=>t.title.toLowerCase())).size]].map(([k,n])=>`<div class="pan"><small>${k}</small><h1 style="margin:0">${n}</h1></div>`).join('')}</div><div class="pan" style="margin-top:16px"><h3>Backup &amp; security</h3><textarea id="bk" placeholder="Export fills this box. Paste a backup here to import."></textarea><div class="bar"><button class="bt2" data-a="exp">EXPORT</button><button class="bt2" data-a="imp">IMPORT</button><button class="bt2" data-a="reset">RESET DEMO</button></div><p class="mu">Backups cover metadata only; uploaded media stays in this browser.</p><div class="grid" style="--cs:130px">${fld('AUDIO MB','lma',LIM().a,'number')}${fld('IMAGE MB','lmi',LIM().i,'number')}${fld('VIDEO MB','lmv',LIM().v,'number')}${fld('MAX MINUTES','lmd',LIM().d,'number')}</div><button class="bt2" data-a="setLim">SAVE UPLOAD LIMITS</button>${fld('HOME ANNOUNCEMENT BANNER','ann',S.ann||'')}<button class="bt2" data-a="setAnn">POST</button>${fld('NEW 8-DIGIT ADMIN ID','npw','','password')}<button class="bt" data-a="setpw">CHANGE PASSCODE</button></div>`;
if(AT=='profile'){const m=S.me||{};b=`<div class="pan"><div class="ban" style="${cov(m,'banner')}"><div class="pf" style="${cov(m,'avatar')};${fr(m)}"></div><div><span class="bdg">GRID_ADMIN</span><h1>${esc(m.name||'Admin')}</h1></div></div>${fld('DISPLAY NAME','mn',m.name||'Admin')}<label>PROFILE PICTURE<input id="mp" type="file" accept="image/*"></label><label>BANNER<input id="mb" type="file" accept="image/*"></label><label>PFP FRAME STYLE<select id="mfs">${opts(FS,m.fs)}</select></label><label>FRAME COLOUR<input id="mfc" type="color" value="${m.fc||'#b6ff3c'}"></label><button class="bt" data-a="saveM">SAVE PROFILE</button></div>`}
if(AT=='bulk')b=`<div class="pan"><h3>⚡ Bulk upload</h3><p class="mu">Pick many audio files at once. Titles come from the file names.</p><label>ARTIST<select id="bar">${S.artists.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>ALBUM (optional)<select id="bal"><option value="">— Singles —</option>${S.albums.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label><label>GENRE<select id="bg">${opts(GEN)}</select></label><label>SHARED COVER (one image for every track)<input id="bco" type="file" accept="image/*"></label><label>SHARED MP4 LOOP (optional)<input id="bvi" type="file" accept="video/*"></label><label class="ck"><input id="bsa" type="checkbox"> Also use it as the album cover</label><label>AUDIO FILES<input id="bf" type="file" accept="audio/*" multiple></label><button class="bt" data-a="bulk">UPLOAD ALL</button></div>`;
if(AT=='genres')b=`<div class="pan"><h3>Genres (${GEN.length})</h3>${fld('ADD CUSTOM GENRE','ng')}<button class="bt" data-a="addG">ADD GENRE</button><div class="chips">${GEN.map(g=>{const c=(S.cg||[]).includes(g);return `<span class="chip ${c?'on':''}" ${c?`data-rg="${esc(g)}"`:''}>${esc(g)}${c?' ✕':''}</span>`}).join('')}</div><p class="mu">Highlighted genres are custom: click one to remove it. Built-ins are locked.</p></div>`;
if(AT=='artists'){const a=S.artists.find(x=>x.id==AE)||{};b=`<div class="two"><div class="pan"><button class="bt" data-a="newA" style="margin:0 0 8px">+ NEW ARTIST</button>${S.artists.map(x=>`<div class="li ${x.id==AE?'on':''}" data-ea="${x.id}">${esc(x.name)}</div>`).join('')}</div><div class="pan"><h3>${a.id?'Edit':'Create'} artist</h3>${fld('NAME *','an',a.name)}<label>BIOGRAPHY<textarea id="ab">${esc(a.bio)}</textarea></label><label>GENRE<select id="ag">${opts(GEN,a.genre)}</select></label><label>BADGE<select id="abd">${opts(['','VERIFIED','GOLD','FEATURED','NEW'],a.badge)}</select></label><label>PFP FRAME STYLE<select id="afs">${opts(FS,a.fs)}</select></label><label>FRAME COLOUR<input id="afc" type="color" value="${a.fc||'#b6ff3c'}"></label><label>FRAME COLOUR 2 (double style)<input id="afc2" type="color" value="${a.fc2||'#7a5cff'}"></label><label class="ck"><input id="afo" type="checkbox" ${a.fc?'checked':''}> Enable frame</label><div class="pf" id="afp" style="margin:14px 8px;${cov(a,'avatar')};${fr(a)}"></div><label>AVATAR IMAGE<input id="aa" type="file" accept="image/*"></label><label>BANNER IMAGE<input id="abn" type="file" accept="image/*"></label><label>FEATURED VIDEO (.mp4)<input id="avf" type="file" accept="video/*"></label>${fld('…or direct .mp4 URL','av',a.vurl)}<div class="bar"><button class="bt" data-a="saveA">SAVE ARTIST</button>${a.id?`<button class="bt2" data-a="delA">DELETE</button>`:''}</div></div></div>`}
if(AT=='upload')b=`<div class="pan"><h3>⬆ Upload track</h3>${S.artists.length?'':'<p>Create an artist first.</p>'}${fld('TITLE','tt')}<label>ARTIST<select id="tar">${S.artists.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>ALBUM (optional)<select id="tal"><option value="">— Single —</option>${S.albums.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label><label>GENRE<select id="tg">${opts(GEN)}</select></label><label>MOODS</label><div id="moods" class="chips">${MOODS.map(m=>`<span class="chip" data-mood>${m}</span>`).join('')}</div><label>AUDIO FILE *<input id="tau" type="file" accept="audio/*"></label><label>COVER IMAGE<input id="tco" type="file" accept="image/*"></label><label>MP4 PREVIEW LOOP (Canvas-style)<input id="tvi" type="file" accept="video/*"></label><label class="ck"><input id="tce" type="checkbox"> Blastr certified original</label><button class="bt" data-a="upT">UPLOAD TRACK</button></div>`;
if(AT=='albums')b=`${abEd()}<div class="two"><div class="pan"><h3>◢ New album</h3>${fld('TITLE','alt')}<label>ARTIST<select id="alart">${S.artists.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>${fld('YEAR','aly',new Date().getFullYear(),'number')}<label>COVER<input id="alc" type="file" accept="image/*"></label><label>TRACKS</label><div id="altr">${trChk(S.artists[0]?.id)}</div><button class="bt" data-a="saveB">CREATE ALBUM</button></div><div class="pan"><h3>Albums</h3>${S.albums.map(x=>`<div class="rg"><span>${esc(x.title)} <small>${esc(A_(x.artistId).name)}</small></span><button class="bt2" style="margin:0" data-eb="${x.id}">EDIT</button><button class="bt2" style="margin:0" data-del="b:${x.id}">DELETE</button></div>`).join('')||'<p class="mu">None yet.</p>'}</div></div>`;
if(AT=='registry')b=`<div class="pan" style="max-width:none"><h3>📊 Track registry (${S.tracks.length})</h3>${trEd()}${bulkBar()}${S.tracks.filter(t=>(t.title+A_(t.artistId).name+t.genre).toLowerCase().includes(RQ.toLowerCase())).map(t=>`<div class="rg"><input type="checkbox" class="sel" value="${t.id}" ${SEL.includes(t.id)?'checked':''} style="width:auto"><div class="th" style="${cov(t)}"></div><span>${esc(t.title)} <small>${esc(A_(t.artistId).name)} · ${esc(t.genre)}${t.video?' · MP4':''}</small></span><button class="bt2" style="margin:0" data-feat="${t.id}">${(S.feat||[]).includes(t.id)?'★':'☆'}</button><button class="bt2" style="margin:0" data-ren="${t.id}">EDIT</button><button class="bt2" style="margin:0" data-del="t:${t.id}">DELETE</button></div>`).join('')}</div>`;
return `<h1>⬡ Admin Matrix <button class="bt2" data-a="lock" style="font-size:12px">🔒 LOCK</button></h1><div class="chips">${tabs}</div>${b}`}};
const hero=t=>{const v=u(t.video);return `<div class="hero" style="${cov(t)}">${v?`<video src="${v}" autoplay muted loop playsinline></video>`:''}<div><small>★ FEATURED TRACK</small><h1>${esc(t.title)}</h1><b>${esc(A_(t.artistId).name)}</b><div class="bar"><button class="bt" data-play="${t.id}">▶ PLAY</button><button class="bt2" data-like="${t.id}" style="color:#fff">♡ LIKE</button></div></div></div>`};
const mvAlb=(t,id)=>{S.albums.forEach(b=>b.trackIds=b.trackIds.filter(i=>i!=t.id));const b=S.albums.find(x=>x.id==id);if(b)b.trackIds.push(t.id);t.albumId=id||''};
const abEd=()=>{const b=S.albums.find(x=>x.id==AB);if(!b)return'';return `<div class="pan" style="margin-bottom:14px;background:var(--p2)"><h3>✎ Edit album</h3>${fld('TITLE','ebt',b.title)}<label>ARTIST<select id="eba">${S.artists.map(x=>`<option value="${x.id}" ${x.id==b.artistId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>${fld('YEAR','eby',b.year||'','number')}<label>REPLACE COVER<input id="ebc" type="file" accept="image/*"></label><label class="ck"><input id="ebs" type="checkbox"> Apply new cover to every track in the album</label><label>TRACKS (tick to include)</label>${S.tracks.map(t=>`<label class="ck"><input type="checkbox" class="ebk" value="${t.id}" ${b.trackIds.includes(t.id)?'checked':''}> ${esc(t.title)} <small>${esc(A_(t.artistId).name)}</small></label>`).join('')}<div class="bar"><button class="bt" data-a="saveEB">SAVE ALBUM</button><button class="bt2" data-a="cancelEB">CLOSE</button></div></div>`};
